
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convert currencies instantly with live exchange rates.">
    <title>Currency Converter | Harshal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="codes.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body>
    <main class="container">
        <h1>Currency Converter</h1>
        <p class="subtitle">Convert currencies with the latest available exchange rates.</p>

        <form id="converter-form">
            <div class="amount">
                <label for="amount">Enter Amount</label>
                <input id="amount" type="number" min="0.01"
                    step="any" value="1" placeholder="Enter amount" required>
            </div>

            <div class="dropdown">
                <div class="currency-box">
                    <label for="from-currency">From</label>
                    <div class="select-container">
                        <img class="from-flag"
                            src="https://flagsapi.com/US/flat/64.png" alt="US flag">
                        <select id="from-currency" name="from"></select>
                    </div>
                </div>

                <button type="button" class="swap-btn" id="swap-btn"
                    aria-label="Swap currencies">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </button>

                <div class="currency-box">
                    <label for="to-currency">To</label>
                    <div class="select-container">
                        <img class="to-flag"
                            src="https://flagsapi.com/IN/flat/64.png" alt="India flag">
                        <select id="to-currency" name="to"></select>
                    </div>
                </div>
            </div>

            <div class="msg" aria-live="polite">
                Enter an amount to convert.
            </div>

            <button type="submit" class="convert-btn">
                Get Exchange Rate
            </button>
        </form>

        <p class="footer">Exchange rates are updated daily by the API.</p>
    </main>
</body>
</html>
